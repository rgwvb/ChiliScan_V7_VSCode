services:
  - type: web
    name: chiliscan-kumo-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m compileall jetson
    startCommand: python jetson/jetson_api.py
    autoDeployTrigger: commit
    envVars:
      - key: CHILISCAN_HOST
        value: 0.0.0.0
      - key: CHILISCAN_ORIGIN
        value: https://rgwvb.github.io
      - key: NVIDIA_KUMO_PREDICT_URL
        value: https://ai.api.nvidia.com/v1/structured-data/nvidia/kumo-tabular/predictions
      - key: CHILISCAN_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
